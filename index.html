<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Euro Münzsammlung Pro</title>
    <style>
        :root {
            --bg-color: #12131C;
            --card-bg: #1A1C29;
            --card-border: #2A2D3E;
            --accent-gold: #E5A93C;
            --accent-gold-soft: rgba(229, 169, 60, 0.15);
            --text-primary: #E2E4EC;
            --text-secondary: #8E92A8;
            --success: #2E7D32;
            --success-bg: rgba(46, 125, 50, 0.2);
            --missing: #C62828;
            --missing-bg: rgba(198, 40, 40, 0.2);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header & Dashboard */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--card-bg);
            padding: 20px 28px;
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            text-align: right;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Controls / Filter */
        .controls {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }

        input, select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-gold);
        }

        /* Coin Grid - Optimized for 12" Tablet */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .coin-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s, border-color 0.2s;
        }

        .coin-card:active {
            transform: scale(0.98);
        }

        .coin-card.collected {
            border-color: var(--accent-gold);
            background: linear-gradient(180deg, var(--card-bg) 0%, var(--accent-gold-soft) 100%);
        }

        /* 2-Euro SVG Graphic */
        .coin-img {
            width: 130px;
            height: 130px;
            margin-bottom: 16px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .coin-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .coin-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.collected {
            background: var(--success-bg);
            color: #81C784;
            border: 1px solid var(--success);
        }

        .badge.missing {
            background: var(--missing-bg);
            color: #E57373;
            border: 1px solid var(--missing);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--card-border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gold);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <svg width="32" height="32" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#C0C0C0" stroke="#D4AF37" stroke-width="8"/>
                    <circle cx="50" cy="50" r="30" fill="#D4AF37"/>
                    <text x="50" y="60" font-size="30" font-weight="bold" fill="#12131C" text-anchor="middle">2€</text>
                </svg>
                2€ Münzsammler Pro
            </h1>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="stat-count">0 / 0</div>
                    <div class="stat-label">Münzen Gesammelt</div>
                    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                </div>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="search" placeholder="Suche (z.B. Deutschland, Erasmus, 2022)...">
            <select id="filter-country">
                <option value="all">Alle Länder</option>
            </select>
            <select id="filter-status">
                <option value="all">Alle Status</option>
                <option value="collected">In Sammlung</option>
                <option value="missing">Fehlend</option>
            </select>
        </div>

        <div class="grid" id="coin-grid"></div>
    </div>

    <script>
    // Münz-Datenbank (Kursmünzen & Vollständige deutsche 2-Euro-Gedenkmünzen bis 2026)
    const coinsData = [
        // Kursmünzen Typen
        { id: 'k_de', country: 'Deutschland', name: 'Bundesadler (Kursmünze)', year: 'Seit 2002', type: 'Kursmünze' },
        { id: 'k_at', country: 'Österreich', name: 'Bertha von Suttner', year: 'Seit 2002', type: 'Kursmünze' },

        { id: 'g_2009', country: 'Gemeinschaftsausgabe', name: '10 Jahre Wirtschafts- und Währungsunion (WWU)', year: '2009', type: 'Gedenkmünze' },
        { id: 'g_2012', country: 'Gemeinschaftsausgabe', name: '10 Jahre Euro-Bargeld', year: '2012', type: 'Gedenkmünze' },
        { id: 'g_2015', country: 'Gemeinschaftsausgabe', name: '30 Jahre EU-Flagge', year: '2015', type: 'Gedenkmünze' },
        { id: 'g_2022', country: 'Gemeinschaftsausgabe', name: '35 Jahre Erasmus-Programm', year: '2022', type: 'Gedenkmünze' },

        // Internationale Highlights
        { id: 'm_2004_gr', country: 'Griechenland', name: 'Olympische Spiele Athen', year: '2004', type: 'Gedenkmünze' },
        { id: 'm_2004_fi', country: 'Finnland', name: 'EU-Erweiterung 2004', year: '2004', type: 'Gedenkmünze' },
        { id: 'm_2005_at', country: 'Österreich', name: '50 Jahre Staatsvertrag', year: '2005', type: 'Gedenkmünze' },
        { id: 'm_2007_mc', country: 'Monaco', name: 'Grace Kelly (25. Todestag)', year: '2007', type: 'Gedenkmünze' },
        { id: 'm_2015_fr', country: 'Frankreich', name: '225 Jahre Föderationsfest', year: '2015', type: 'Gedenkmünze' },
        { id: 'm_2024_fr', country: 'Frankreich', name: 'Olympische Spiele Paris 2024', year: '2024', type: 'Gedenkmünze' },

        // DEUTSCHLAND: Alle 2-Euro-Gedenkmünzen (Bundesländer Serie I & II + Sonderanlässe)
        { id: 'm_2006_de', country: 'Deutschland', name: 'Schleswig-Holstein (Holstentor Lübeck)', year: '2006', type: 'Gedenkmünze' },
        { id: 'm_2007_de_rv', country: 'Deutschland', name: '50 Jahre Römische Verträge', year: '2007', type: 'Gedenkmünze' },
        { id: 'm_2007_de', country: 'Deutschland', name: 'Mecklenburg-Vorpommern (Schweriner Schloss)', year: '2007', type: 'Gedenkmünze' },
        { id: 'm_2008_de', country: 'Deutschland', name: 'Hamburg (St. Michaelis Kirche)', year: '2008', type: 'Gedenkmünze' },
        { id: 'm_2009_de_wwu', country: 'Deutschland', name: '10 Jahre Wirtschafts- und Währungsunion (WWU)', year: '2009', type: 'Gedenkmünze' },
        { id: 'm_2009_de', country: 'Deutschland', name: 'Saarland (Ludwigskirche Saarbrücken)', year: '2009', type: 'Gedenkmünze' },
        { id: 'm_2010_de', country: 'Deutschland', name: 'Bremen (Bremer Rathaus und Roland)', year: '2010', type: 'Gedenkmünze' },
        { id: 'm_2011_de', country: 'Deutschland', name: 'Nordrhein-Westfalen (Kölner Dom)', year: '2011', type: 'Gedenkmünze' },
        { id: 'm_2012_de_euro', country: 'Deutschland', name: '10 Jahre Euro-Bargeld', year: '2012', type: 'Gedenkmünze' },
        { id: 'm_2012_de', country: 'Deutschland', name: 'Bayern (Schloss Neuschwanstein)', year: '2012', type: 'Gedenkmünze' },
        { id: 'm_2013_de_elysee', country: 'Deutschland', name: '50 Jahre Élysée-Vertrag', year: '2013', type: 'Gedenkmünze' },
        { id: 'm_2013_de', country: 'Deutschland', name: 'Baden-Württemberg (Kloster Maulbronn)', year: '2013', type: 'Gedenkmünze' },
        { id: 'm_2014_de', country: 'Deutschland', name: 'Niedersachsen (St. Michaelis Hildesheim)', year: '2014', type: 'Gedenkmünze' },
        { id: 'm_2015_de_einheit', country: 'Deutschland', name: '25 Jahre Deutsche Einheit', year: '2015', type: 'Gedenkmünze' },
        { id: 'm_2015_de_flagge', country: 'Deutschland', name: '30 Jahre EU-Flagge', year: '2015', type: 'Gedenkmünze' },
        { id: 'm_2015_de', country: 'Deutschland', name: 'Hessen (Paulskirche Frankfurt)', year: '2015', type: 'Gedenkmünze' },
        { id: 'm_2016_de', country: 'Deutschland', name: 'Sachsen (Dresdner Zwinger)', year: '2016', type: 'Gedenkmünze' },
        { id: 'm_2017_de', country: 'Deutschland', name: 'Rheinland-Pfalz (Porta Nigra Trier)', year: '2017', type: 'Gedenkmünze' },
        { id: 'm_2018_de_schmidt', country: 'Deutschland', name: '100. Geburtstag Helmut Schmidt', year: '2018', type: 'Gedenkmünze' },
        { id: 'm_2018_de', country: 'Deutschland', name: 'Berlin (Schloss Charlottenburg)', year: '2018', type: 'Gedenkmünze' },
        { id: 'm_2019_de_mauerfall', country: 'Deutschland', name: '30 Jahre Mauerfall', year: '2019', type: 'Gedenkmünze' },
        { id: 'm_2019_de', country: 'Deutschland', name: '70 Jahre Bundesrat', year: '2019', type: 'Gedenkmünze' },
        { id: 'm_2020_de_kniefall', country: 'Deutschland', name: '50 Jahre Kniefall von Warschau', year: '2020', type: 'Gedenkmünze' },
        { id: 'm_2020_de', country: 'Deutschland', name: 'Brandenburg (Schloss Sanssouci)', year: '2020', type: 'Gedenkmünze' },
        { id: 'm_2021_de', country: 'Deutschland', name: 'Sachsen-Anhalt (Magdeburger Dom)', year: '2021', type: 'Gedenkmünze' },
        { id: 'm_2022_de_erasmus', country: 'Deutschland', name: '35 Jahre Erasmus-Programm', year: '2022', type: 'Gedenkmünze' },
        { id: 'm_2022_de', country: 'Deutschland', name: 'Thüringen (Wartburg Eisenach)', year: '2022', type: 'Gedenkmünze' },
        { id: 'm_2023_de_karl', country: 'Deutschland', name: '1275. Geburtstag Karl der Große', year: '2023', type: 'Gedenkmünze' },
        { id: 'm_2023_de', country: 'Deutschland', name: 'Hamburg (Elbphilharmonie - Bundesländer II)', year: '2023', type: 'Gedenkmünze' },
        { id: 'm_2024_de_paulskirche', country: 'Deutschland', name: '175 Jahre Paulskirchenverfassung', year: '2024', type: 'Gedenkmünze' },
        { id: 'm_2024_de', country: 'Deutschland', name: 'Mecklenburg-Vorpommern (Königsstuhl - Bundesländer II)', year: '2024', type: 'Gedenkmünze' },
        { id: 'm_2025_de_einheit', country: 'Deutschland', name: '35 Jahre Deutsche Einheit', year: '2025', type: 'Gedenkmünze' },
        { id: 'm_2025_de', country: 'Deutschland', name: 'Saarland (Saarschleife - Bundesländer II)', year: '2025', type: 'Gedenkmünze' },
        { id: 'm_2026_de_adenauer', country: 'Deutschland', name: '150. Geburtstag Konrad Adenauer', year: '2026', type: 'Gedenkmünze' },
        { id: 'm_2026_de', country: 'Deutschland', name: 'Bremen (Klimahaus Bremerhaven - Bundesländer II)', year: '2026', type: 'Gedenkmünze' }
    ];

    // LocalStorage Initialisierung
    let userStorage = JSON.parse(localStorage.getItem('euro_coins_collection')) || {};

    const grid = document.getElementById('coin-grid');
    const searchInput = document.getElementById('search');
    const countrySelect = document.getElementById('filter-country');
    const statusSelect = document.getElementById('filter-status');

    // Dynamische Vektor-Grafik für Münzen generieren
    function createCoinSVG(text) {
        return `
        <svg class="coin-img" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="2"/>
            <circle cx="50" cy="50" r="34" fill="#F3C649" stroke="#E5A93C" stroke-width="2"/>
            <!-- Sterne auf dem äußeren Ring -->
            <g fill="#4B5563">
                <circle cx="50" cy="8" r="1.5"/><circle cx="50" cy="92" r="1.5"/>
                <circle cx="8" cy="50" r="1.5"/><circle cx="92" cy="50" r="1.5"/>
                <circle cx="20" cy="20" r="1.5"/><circle cx="80" cy="80" r="1.5"/>
                <circle cx="80" cy="20" r="1.5"/><circle cx="20" cy="80" r="1.5"/>
            </g>
            <text x="50" y="54" font-size="11" font-weight="bold" fill="#5B4110" text-anchor="middle">${text}</text>
        </svg>`;
    }

    // Filter-Optionen befüllen
    function initFilters() {
        const countries = [...new Set(coinsData.map(c => c.country))].sort();
        countries.forEach(country => {
            const opt = document.createElement('option');
            opt.value = country;
            opt.textContent = country;
            countrySelect.appendChild(opt);
        });
    }

    // App Rendern
    function render() {
        const searchVal = searchInput.value.toLowerCase();
        const countryVal = countrySelect.value;
        const statusVal = statusSelect.value;

        grid.innerHTML = '';
        let collectedCount = 0;

        const filtered = coinsData.filter(coin => {
            const isCollected = !!userStorage[coin.id];
            if (isCollected) collectedCount++;

            const matchesSearch = coin.name.toLowerCase().includes(searchVal) || 
                                  coin.country.toLowerCase().includes(searchVal) || 
                                  coin.year.includes(searchVal);
            const matchesCountry = countryVal === 'all' || coin.country === countryVal;
            const matchesStatus = statusVal === 'all' || 
                                 (statusVal === 'collected' && isCollected) || 
                                 (statusVal === 'missing' && !isCollected);

            return matchesSearch && matchesCountry && matchesStatus;
        });

        filtered.forEach(coin => {
            const isCollected = !!userStorage[coin.id];
            const card = document.createElement('div');
            card.className = `coin-card ${isCollected ? 'collected' : ''}`;
            
            // Abkürzung für das Münzzentrum
            const shortCode = coin.country.substring(0, 3).toUpperCase();

            card.innerHTML = `
                ${createCoinSVG(shortCode)}
                <div class="coin-title">${coin.name}</div>
                <div class="coin-meta">${coin.country} • ${coin.year}</div>
                <div class="badge ${isCollected ? 'collected' : 'missing'}">
                    ${isCollected ? 'In Sammlung' : 'Fehlt'}
                </div>
            `;

            card.onclick = () => toggleCoin(coin.id);
            grid.appendChild(card);
        });

        // Statistik aktualisieren
        const total = coinsData.length;
        const percent = total > 0 ? Math.round((collectedCount / total) * 100) : 0;
        document.getElementById('stat-count').textContent = `${collectedCount} / ${total}`;
        document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    function toggleCoin(id) {
        userStorage[id] = !userStorage[id];
        if (!userStorage[id]) delete userStorage[id];
        localStorage.setItem('euro_coins_collection', JSON.stringify(userStorage));
        render();
    }

    // Event Listener
    searchInput.oninput = render;
    countrySelect.onchange = render;
    statusSelect.onchange = render;

    // Init
    initFilters();
    render();
    </script>
</body>
</html>
