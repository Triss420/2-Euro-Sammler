<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d5a6c">
<title>2€ Sammler</title>
<style>
:root{
  --bg:#f3f1ea;--panel:#fffdf8;--text:#3a3630;--muted:#7c7568;--line:#e6e1d5;
  --accent:#5c8a8a;--accent2:#466e6e;--good:#5f8f5a;--warn:#b98a3d;--bad:#c1604f;
  --top:#3d5a6c;--top2:#2f4652;--panel2:#f7f4ec;--coinbg1:#faf7f0;--coinbg2:#e9e3d4;--coinring:#d8d0bd;--coinface:#5a5346;
  --shadow:0 8px 28px rgba(58,54,48,.08);--r:18px
}
:root[data-theme="dark"]{
  --bg:#20242a;--panel:#2a2f37;--text:#e7e4dc;--muted:#a3a099;--line:#3a3f47;
  --accent:#7aa8a8;--accent2:#5c8a8a;--good:#7fb679;--warn:#d9a35c;--bad:#d9806e;
  --top:#171a1f;--top2:#12151a;--panel2:#252a31;--coinbg1:#333940;--coinbg2:#262b31;--coinring:#454b53;--coinface:#d8d4c8;
  --shadow:0 8px 28px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;transition:background .2s,color .2s}
button,input,select{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--top),var(--top2));color:#fbf9f4;padding:14px 18px;display:flex;gap:14px;align-items:center}
.logo{font-weight:800;font-size:20px;white-space:nowrap}.logo span{color:#e8c468}
.search{flex:1;max-width:760px;margin:auto;position:relative}.search input{width:100%;padding:13px 16px 13px 42px;border-radius:14px;border:0;outline:0;background:var(--panel);color:var(--text)}
.search b{position:absolute;left:15px;top:11px;color:var(--muted)}
.actions{display:flex;gap:8px}.iconbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fbf9f4;border-radius:12px;padding:10px 12px}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.wrap{max-width:1450px;margin:auto;padding:22px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-bottom:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.heroMain{padding:25px}.heroMain h1{margin:0 0 8px;font-size:32px;color:var(--text)}.heroMain p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.stat{padding:15px;border-radius:15px;background:var(--panel2);border:1px solid var(--line)}.stat strong{font-size:25px;display:block;color:var(--text)}.stat span{color:var(--muted);font-size:13px}
.progress{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .3s}
.progressWrap{display:flex;align-items:center;gap:12px;margin-top:12px}
.progressWrap .progress{flex:1;margin-top:0}
.progressLabel{font-weight:800;font-size:15px;color:var(--text);min-width:4.5em;text-align:right;white-space:nowrap}
.heroSide{padding:20px}.heroSide h3{margin:0 0 12px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:13px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;text-align:left}.quick button:hover{border-color:var(--accent)}
.tabs{display:flex;gap:8px;margin:8px 0 15px;overflow:auto}.tab{border:0;background:var(--panel2);color:var(--text);border-radius:999px;padding:10px 16px;white-space:nowrap}.tab.active{background:var(--accent);color:#fff}
.filters{display:grid;grid-template-columns:1.6fr .8fr .8fr .8fr;gap:10px;margin-bottom:16px}.filters input,.filters select{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);outline:0}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}.sectionHead h2{margin:0}.count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 4px 16px rgba(58,54,48,.06);transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.coinpic{height:190px;background:linear-gradient(145deg,var(--coinbg1),var(--coinbg2));display:flex;align-items:center;justify-content:center;position:relative}
.coinmock{width:138px;height:138px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--coinbg1),var(--coinring) 55%,var(--coinring));border:7px solid var(--coinring);box-shadow:0 10px 18px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--coinface);font-weight:800}
.coinmock .flag{font-size:34px;line-height:1;margin-bottom:2px}
.coinmock .e{font-size:30px;line-height:1}<small>{font-size:10.5px;letter-spacing:.5px;margin-top:2px}</small>
.badge{position:absolute;top:10px;left:10px;z-index:2;padding:6px 9px;border-radius:999px;font-size:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);pointer-events:none}
.owned{position:absolute;top:10px;right:10px;z-index:2;background:var(--good);color:#fff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700;pointer-events:none}
.coin-real-img{max-width:90%;max-height:175px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.16))}
.cardbody{padding:14px}.country{font-size:13px;color:var(--muted);font-weight:700}.title{font-weight:800;margin:4px 0 7px;line-height:1.25;color:var(--text)}.year{font-size:13px;color:var(--muted)}.cardfoot{display:flex;gap:7px;margin-top:12px}.smallbtn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px}.smallbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{padding:45px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:17px}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);margin-bottom:15px}
.modal{position:fixed;inset:0;background:rgba(20,20,18,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modalbox{background:var(--panel);color:var(--text);border-radius:22px;max-width:850px;width:100%;max-height:92vh;overflow:auto}.modalhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.close{border:0;background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 11px}.modalgrid{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px}.bigimg{width:100%;height:330px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:18px}.bigimg img{max-width:96%;max-height:315px;border-radius:50%}.detail p{line-height:1.55}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;background:var(--panel2);color:var(--text);border-radius:999px;font-size:13px}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0}

/* Druck-Styles */
#printArea{display:none}
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; font-family: Arial, sans-serif; padding: 20px; }
  #printArea table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
  #printArea th, #printArea td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 12px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">2€ <span>Sammler</span></div>
  <div class="search"><b>⌕</b><input id="globalSearch" placeholder="Land, Jahr, Motiv …"></div>
  <div class="actions">
    <button class="iconbtn" id="printBtn" title="Drucken">🖨️</button>
    <button class="iconbtn" id="themeBtn">🌓</button>
    <button class="iconbtn" id="exportBtn" title="Exportieren">↥</button>
    <button class="iconbtn" id="importBtn" title="Importieren">↧</button>
    <button class="iconbtn" id="resetBtn" title="Speicher zurücksetzen" style="color:#d9806e">🗑️</button>
    <input type="file" id="fileInput" accept=".json" hidden>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="panel heroMain">
      <h1>Meine 2-Euro-Sammlung</h1>
      <p>Lokal gesichert auf deinem Gerät.</p>
      <div class="stats">
        <div class="stat"><strong id="ownedCount">0 / 0</strong><span>Münzen gesammelt</span></div>
        <div class="stat"><strong id="missingCount">0</strong><span>Fehlen noch</span></div>
        <div class="stat"><strong id="valueCount">0 €</strong><span>Gesamtwert</span></div>
      </div>
      <div class="progressWrap">
        <div class="progress"><div id="progressBar"></div></div>
        <div class="progressLabel" id="progressLabel">0 %</div>
      </div>
    </div>
    <div class="panel heroSide">
      <h3>Schnellzugriff</h3>
      <div class="quick">
        <button data-filter="missing">❌<br><b>Fehlende</b></button>
        <button data-filter="owned">✅<br><b>Meine Münzen</b></button>
        <button data-filter="comm">🏛️<br><b>Gedenkmünzen</b></button>
        <button data-filter="regular">🪙<br><b>Umlaufmünzen</b></button>
      </div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="all">Alle</button>
    <button class="tab" data-tab="regular">Umlaufmünzen</button>
    <button class="tab" data-tab="comm">Gedenkmünzen</button>
    <button class="tab" data-tab="owned">Gesammelt</button>
    <button class="tab" data-tab="mine">Meine Excel-Liste</button>
    <button class="tab" data-tab="missing">Fehlen</button>
  </div>

  <div class="filters" id="filters">
    <input id="search" placeholder="🔎 Suche im Katalog …">
    <select id="country"><option value="">Alle Länder</option></select>
    <select id="year"><option value="">Alle Jahre</option></select>
    <select id="sort"><option value="yearDesc">Neueste zuerst</option><option value="yearAsc">Älteste zuerst</option><option value="country">Land</option><option value="title">Motiv</option></select>
  </div>

  <div class="sectionHead"><h2 id="heading">Katalog</h2><div class="count" id="resultCount"></div></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead"><div><b id="mTitle">Münze</b><div id="mSub" class="country"></div></div><button class="close" onclick="closeModal()">✕</button></div>
    <div class="modalgrid">
      <div class="bigimg" id="mImage"></div>
      <div class="detail">
        <div class="row" id="mPills"></div>
        <p id="mDesc"></p>
        <label style="display:block;margin:15px 0"><b>Status</b><br>
          <select id="mOwned" style="margin-top:7px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px">
            <option value="0">❌ Fehlt</option><option value="1">✅ Vorhanden</option>
          </select>
        </label>
        <label style="display:block"><b>Anzahl</b><br><input id="mQty" type="number" min="1" max="999" value="1" style="margin-top:7px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px"></label>
        <button class="smallbtn primary" style="width:100%;margin-top:12px;padding:12px" onclick="saveModal()">Speichern</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script>
const STORE='twoEuroCollectorV2';

const COUNTRY_FLAG={"Andorra":"🇦🇩","Österreich":"🇦🇹","Belgien":"🇧🇪","Bulgarien":"🇧🇬","Kroatien":"🇭🇷","Zypern":"🇨🇾",
"Estland":"🇪🇪","Finnland":"🇫🇮","Frankreich":"🇫🇷","Deutschland":"🇩🇪","Griechenland":"🇬🇷","Irland":"🇮🇪",
"Italien":"🇮🇹","Lettland":"🇱🇻","Litauen":"🇱🇹","Luxemburg":"🇱🇺","Malta":"🇲🇹","Monaco":"🇲🇨","Niederlande":"🇳🇱",
"Portugal":"🇵🇹","San Marino":"🇸🇲","Slowakei":"🇸🇰","Slowenien":"🇸🇮","Spanien":"🇪🇸","Vatikan":"🇻🇦"};

function flagFor(c){ return COUNTRY_FLAG[String(c||'').trim()] || '🇪🇺'; }

// Integrierte Basissammlung (Umlauf & Excel-Münzen)
const baseCoins = [
  {"id":"imp3","type":"regular","country":"Deutschland","year":2002,"title":"Bundesadler (2002)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp3_d","type":"regular","country":"Deutschland","year":2002,"title":"Bundesadler (2002)","mintmark":"D","owned":1,"qty":1},
  {"id":"imp3_f","type":"regular","country":"Deutschland","year":2002,"title":"Bundesadler (2002)","mintmark":"F","owned":1,"qty":1},
  {"id":"imp3_g","type":"regular","country":"Deutschland","year":2002,"title":"Bundesadler (2002)","mintmark":"G","owned":1,"qty":1},
  {"id":"imp3_j","type":"regular","country":"Deutschland","year":2002,"title":"Bundesadler (2002)","mintmark":"J","owned":1,"qty":1},
  {"id":"imp10","type":"comm","country":"Deutschland","year":2007,"title":"50 Jahre Römische Verträge","mintmark":"A","owned":1,"qty":1},
  {"id":"imp14","type":"comm","country":"Deutschland","year":2009,"title":"10 Jahre Wirtschafts- und Währungsunion","mintmark":"A","owned":1,"qty":1},
  {"id":"imp16","type":"comm","country":"Deutschland","year":2010,"title":"Bremen (Rathaus & Roland)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp18","type":"comm","country":"Deutschland","year":2011,"title":"Nordrhein-Westfalen (Kölner Dom)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp19","type":"comm","country":"Deutschland","year":2012,"title":"Bayern (Schloss Neuschwanstein)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp20","type":"comm","country":"Deutschland","year":2012,"title":"10 Jahre Euro-Bargeld","mintmark":"A","owned":1,"qty":1},
  {"id":"imp24","type":"comm","country":"Deutschland","year":2014,"title":"Niedersachsen (St. Michaelis Hildesheim)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp26","type":"comm","country":"Deutschland","year":2015,"title":"Hessen (Paulskirche Frankfurt)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp27","type":"comm","country":"Deutschland","year":2015,"title":"30 Jahre EU-Flagge","mintmark":"A","owned":1,"qty":1},
  {"id":"imp29","type":"comm","country":"Deutschland","year":2016,"title":"Sachsen (Zwinger Dresden)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp31","type":"comm","country":"Deutschland","year":2017,"title":"Rheinland-Pfalz (Porta Nigra Trier)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp32","type":"comm","country":"Deutschland","year":2018,"title":"Helmut Schmidt","mintmark":"A","owned":1,"qty":1},
  {"id":"imp33","type":"comm","country":"Deutschland","year":2018,"title":"Berlin (Schloss Charlottenburg)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp35","type":"comm","country":"Deutschland","year":2019,"title":"70 Jahre Bundesrat","mintmark":"A","owned":1,"qty":1},
  {"id":"imp36","type":"comm","country":"Deutschland","year":2019,"title":"30 Jahre Mauerfall","mintmark":"A","owned":1,"qty":1},
  {"id":"imp37","type":"comm","country":"Deutschland","year":2020,"title":"Brandenburg (Schloss Sanssouci)","mintmark":"A","owned":1,"qty":1},
  {"id":"imp41","type":"comm","country":"Deutschland","year":2021,"title":"Sachsen-Anhalt (Magdeburger Dom)","mintmark":"A","owned":1,"qty":1},
  {"id":"r0","type":"regular","country":"Österreich","year":2002,"title":"Bertha von Suttner","owned":0,"qty":0},
  {"id":"r1","type":"regular","country":"Frankreich","year":1999,"title":"Baum des Lebens","owned":0,"qty":0},
  {"id":"r2","type":"regular","country":"Italien","year":2002,"title":"Dante Alighieri","owned":0,"qty":0},
  {"id":"r3","type":"regular","country":"Spanien","year":1999,"title":"König Juan Carlos I","owned":0,"qty":0}
];

let allCoins = [];
let currentTab = 'all';
let activeCoinId = null;

function renderStats(){
  const total = allCoins.length;
  const ownedCoins = allCoins.filter(c => c.owned > 0);
  const ownedCount = ownedCoins.length;
  const missing = total - ownedCount;
  const totalValue = ownedCoins.reduce((sum, c) => sum + ((c.qty || 1) * 2), 0);
  const percent = total > 0 ? Math.round((ownedCount / total) * 100) : 0;

  document.getElementById('ownedCount').innerText = `${ownedCount} / ${total}`;
  document.getElementById('missingCount').innerText = missing;
  document.getElementById('valueCount').innerText = `${totalValue} €`;
  document.getElementById('progressBar').style.width = `${percent}%`;
  document.getElementById('progressLabel').innerText = `${percent} %`;
}

function initFilters(){
  const countrySel = document.getElementById('country');
  const yearSel = document.getElementById('year');
  
  const countries = [...new Set(allCoins.map(c => c.country).filter(Boolean))].sort();
  const years = [...new Set(allCoins.map(c => c.year).filter(y => y && y > 0))].sort((a,b) => b - a);

  countrySel.innerHTML = '<option value="">Alle Länder</option>' + countries.map(c => `<option value="${c}">${c}</option>`).join('');
  yearSel.innerHTML = '<option value="">Alle Jahre</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const query = (document.getElementById('search').value || document.getElementById('globalSearch').value).toLowerCase().trim();
  const countryFilter = document.getElementById('country').value;
  const yearFilter = document.getElementById('year').value;
  const sortFilter = document.getElementById('sort').value;

  let filtered = allCoins.filter(c => {
    if(currentTab === 'regular' && c.type !== 'regular') return false;
    if(currentTab === 'comm' && c.type !== 'comm') return false;
    if(currentTab === 'owned' && (!c.owned || c.owned <= 0)) return false;
    if(currentTab === 'missing' && c.owned > 0) return false;
    if(currentTab === 'mine' && !c.id.startsWith('imp')) return false;

    if(countryFilter && c.country !== countryFilter) return false;
    if(yearFilter && String(c.year) !== yearFilter) return false;

    if(query){
      const matchText = `${c.country} ${c.year} ${c.title} ${c.mintmark||''}`.toLowerCase();
      if(!matchText.includes(query)) return false;
    }
    return true;
  });

  filtered.sort((a,b) => {
    if(sortFilter === 'yearDesc') return (b.year || 0) - (a.year || 0);
    if(sortFilter === 'yearAsc') return (a.year || 0) - (b.year || 0);
    if(sortFilter === 'country') return (a.country || '').localeCompare(b.country || '');
    if(sortFilter === 'title') return (a.title || '').localeCompare(b.title || '');
    return 0;
  });

  document.getElementById('resultCount').innerText = `${filtered.length} Münzen gefunden`;

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">Keine Münzen gefunden.</div>';
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const isOwned = c.owned > 0;
    return `
      <div class="card">
        <div class="coinpic">
          <span class="badge">${c.type==='comm'?'Gedenkmünze':'Umlauf'}</span>
          ${isOwned ? `<span class="owned">✅ ${c.qty > 1 ? c.qty+'x' : 'Vorhanden'}</span>` : ''}
          <div class="coinmock"><span class="flag">${flagFor(c.country)}</span><span class="e">2€</span><small>${c.year||''}</small></div>
        </div>
        <div class="cardbody">
          <div class="country">${flagFor(c.country)} ${c.country} ${c.mintmark ? '· Mint '+c.mintmark : ''}</div>
          <div class="title">${c.title}</div>
          <div class="year">${c.year ? 'Jahr: '+c.year : ''}</div>
          <div class="cardfoot">
            <button class="smallbtn" onclick="toggleOwned('${c.id}')">${isOwned ? 'Entfernen' : 'Hinzufügen'}</button>
            <button class="smallbtn primary" onclick="openModal('${c.id}')">Details</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleOwned(id){
  const coin = allCoins.find(c => c.id === id);
  if(coin){
    coin.owned = coin.owned > 0 ? 0 : 1;
    coin.qty = coin.owned > 0 ? 1 : 0;
    saveToStorage();
    renderStats();
    renderGrid();
  }
}

function openModal(id){
  activeCoinId = id;
  const c = allCoins.find(x => x.id === id);
  if(!c) return;

  document.getElementById('mTitle').innerText = c.title;
  document.getElementById('mSub').innerText = `${flagFor(c.country)} ${c.country} ${c.year ? '· ' + c.year : ''}`;
  document.getElementById('mDesc').innerText = c.desc || '2-Euro-Sammelmünze.';
  document.getElementById('mOwned').value = c.owned > 0 ? "1" : "0";
  document.getElementById('mQty').value = c.qty || 1;
  document.getElementById('mImage').innerHTML = `<div class="coinmock" style="width:180px;height:180px"><span class="flag" style="font-size:48px">${flagFor(c.country)}</span><span class="e" style="font-size:40px">2€</span><small>${c.year||''}</small></div>`;

  document.getElementById('modal').classList.add('open');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }

function saveModal(){
  if(!activeCoinId) return;
  const c = allCoins.find(x => x.id === activeCoinId);
  if(c){
    c.owned = parseInt(document.getElementById('mOwned').value);
    c.qty = parseInt(document.getElementById('mQty').value) || 1;
    if(c.owned === 0) c.qty = 0;
    saveToStorage();
    renderStats();
    renderGrid();
    closeModal();
  }
}

function saveToStorage(){
  const savedData = allCoins.map(c => ({ id: c.id, owned: c.owned, qty: c.qty }));
  localStorage.setItem(STORE, JSON.stringify(savedData));
}

function loadStorage(){
  const raw = localStorage.getItem(STORE);
  if(!raw) return;
  try {
    const saved = JSON.parse(raw);
    saved.forEach(s => {
      const coin = allCoins.find(c => c.id === s.id);
      if(coin){
        coin.owned = s.owned || 0;
        coin.qty = s.qty || 0;
      }
    });
  } catch(e){ console.error(e); }
}

function initApp(){
  allCoins = JSON.parse(JSON.stringify(baseCoins));
  loadStorage();
  initFilters();
  renderStats();
  renderGrid();

  document.getElementById('search').oninput = renderGrid;
  document.getElementById('globalSearch').oninput = () => {
    document.getElementById('search').value = document.getElementById('globalSearch').value;
    renderGrid();
  };
  document.getElementById('country').onchange = renderGrid;
  document.getElementById('year').onchange = renderGrid;
  document.getElementById('sort').onchange = renderGrid;

  document.querySelectorAll('.tabs .tab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.getAttribute('data-tab');
      renderGrid();
    };
  });

  document.querySelectorAll('.quick button').forEach(btn => {
    btn.onclick = () => {
      const filter = btn.getAttribute('data-filter');
      const tabBtn = document.querySelector(`.tab[data-tab="${filter}"]`);
      if(tabBtn) tabBtn.click();
    };
  });

  document.getElementById('resetBtn').onclick = () => {
    if(confirm("Möchtest du deinen lokalen Speicher wirklich zurücksetzen?")){
      localStorage.removeItem(STORE);
      localStorage.removeItem('twoEuroCollectorV1');
      location.reload();
    }
  };
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
